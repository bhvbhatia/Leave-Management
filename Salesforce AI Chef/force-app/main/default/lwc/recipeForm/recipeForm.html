<template>
    <form class="slds-box slds-p-around-medium">
		<h1 class="slds-text-heading_large slds-p-around_small">Find your perfect recipe using AI</h1>
		<lightning-textarea label="Ingredients (comma separated)"
		placeholder="e.e., pasta, onions etc"
		required
		name="ingredients" value={formData.ingredients}
		onchange={handleChange}></lightning-textarea>
		<lightning-combobox label="Dietary Restrictions"
		placeholder="Select restriction"
		name="dietaryRestrictions"
		options={dietaryOptions}
		value={formData.dietaryRestrictions}
		onchange={handleChange}>
	</lightning-combobox>
	<lightning-combobox label="Meal Type"
		placeholder="Select meal type"
		name="mealType"
		options={mealTypeOptions}
		value={formData.mealType}
		onchange={handleChange}>
	</lightning-combobox>
	<lightning-input type ="number"
		label="Servings"
		name="servings" 
		value={formData.servings}
		onchange={handleChange}>
	</lightning-input>
	<div class="slds-m-top_medium">
		<lightning-button
		 label="Generate Recipes" 
		variant="brand" 
		onclick={generateRecipe}>
	</lightning-button>
	</div>
	</form>
</template>
